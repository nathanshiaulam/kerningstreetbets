name: Refresh prices
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-prices.mjs"
      - ".github/workflows/prices.yml"
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Fetch prices
        run: |
          node --version
          out=$(node scripts/refresh-prices.mjs 2>&1) || echo "::warning title=Price script::${out//$'\n'/ }"
          echo "$out"
      - name: Commit and push
        run: |
          git config user.name "price-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "::notice title=Prices::Nothing changed"; exit 0; fi
          out=$(git commit -m "Refresh prices" 2>&1) || { echo "::error title=Commit failed::${out//$'\n'/ }"; exit 1; }
          out=$(git push 2>&1) || out=$(git pull --rebase 2>&1 && git push 2>&1) || { echo "::error title=Push failed::${out//$'\n'/ }"; exit 1; }
          echo "::notice title=Prices::Committed a refresh"
