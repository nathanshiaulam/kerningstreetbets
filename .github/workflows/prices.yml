name: Refresh prices
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-prices.mjs"
      - ".github/workflows/prices.yml"
permissions:
  contents: write
concurrency: prices
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-prices.mjs
        continue-on-error: true
      - name: Commit if prices changed
        run: |
          git config user.name "price-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/catalog.json data/refresh-log.json
          git diff --cached --quiet || (git commit -m "Refresh prices" && git pull --rebase && git push)
